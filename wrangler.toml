# The waliori hub: static files only, served as Worker assets. Cloudflare Workers Builds deploys on every push to main:
#   npx wrangler deploy
# The custom domains walior.it and www.walior.it are routes of this Worker; the workers.dev address stays as a preview.
name = "waliori-hub"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true
routes = [
  { pattern = "walior.it", custom_domain = true },
  { pattern = "www.walior.it", custom_domain = true },
]

[assets]
directory = "site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
