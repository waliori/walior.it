<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../site/fonts/martian-mono.css">
<link rel="stylesheet" href="../../site/tokens.css"><link rel="stylesheet" href="../../site/base.css">
<style>
/* One thumbnail for every video. Locked to design.md: paper, phosphor, Martian Mono, the four slashes.
   The frame is one still from the module, pulled toward the paper so it reads as texture; the path is the only text;
   the mark sits top right at the same size on every one. Opened as thumb.html?frame=<file>&path=/PATH&dim=0.55&zoom=1 (zoom crops a burned-in caption out of the frame) */
html, body { height: 100%; margin: 0; }
body { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--color-paper); }
.frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.85) contrast(1.05) brightness(var(--dim, 0.55)); transform: scale(var(--zoom, 1)); transform-origin: center; }
/* a paper wash from the bottom so the path never needs a plate */
.wash { position: absolute; inset: 0; background: linear-gradient(to top, var(--color-paper) 0%, transparent 46%), linear-gradient(to left, transparent 70%, transparent); }
.scan { position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, transparent 0 2px, rgb(0 0 0 / .18) 2px 3px); mix-blend-mode: multiply; }
.path { position: absolute; left: 64px; bottom: 48px; margin: 0; font: 500 92px/1 var(--font-display); font-stretch: 100%; letter-spacing: -0.01em; color: var(--color-accent); white-space: nowrap; }
.path.long { font-size: 74px; }
.sub { position: absolute; left: 66px; bottom: 172px; margin: 0; font: 400 30px/1 var(--font-display); color: var(--color-ink-2); }
.mark { position: absolute; right: 56px; top: 44px; width: 150px; height: auto; color: var(--color-accent); }
</style></head><body>
<img class="frame" id="frame" alt="">
<div class="wash"></div><div class="scan"></div>
<p class="sub" id="sub" hidden></p>
<p class="path" id="path"></p>
<svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 64" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" aria-hidden="true"><path d="M5 8 31 56M41 56 67 8M77 8 103 56M113 56 139 8"/></svg>
<script>
const q = new URLSearchParams(location.search);
const path = q.get('path') || '/PATH';
document.getElementById('frame').src = q.get('frame') || '';
document.documentElement.style.setProperty('--dim', q.get('dim') || '0.55');
document.documentElement.style.setProperty('--zoom', q.get('zoom') || '1');
const p = document.getElementById('path'); p.textContent = path; if (path.length > 12) p.classList.add('long');
if (q.get('sub')) { const s = document.getElementById('sub'); s.textContent = q.get('sub'); s.hidden = false; }
</script>
</body></html>
